version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      androidx-compose:
        patterns: ["androidx.*", "org.jetbrains.kotlin*", "com.android.tools.build*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
